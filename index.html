<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JX CHAT</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #05051a;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .splash {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at 15% 10%, #4b20d8 0%, transparent 30%),
        radial-gradient(circle at 90% 90%, #3020c9 0%, transparent 35%),
        linear-gradient(145deg, #08082b, #090018);
      color: white;
    }

    .logo {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 58px;
      font-weight: bold;
      background: linear-gradient(135deg, #d52cff, #613cff, #00cfff);
      box-shadow:
        0 0 25px #8b35ff,
        0 0 60px #4433ff;
      margin-bottom: 28px;
      position: relative;
    }

    .logo::after {
      content: "";
      position: absolute;
      bottom: -12px;
      right: 12px;
      width: 42px;
      height: 42px;
      background: #573cff;
      clip-path: polygon(0 0, 100% 0, 100% 100%);
    }

    .name {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .name span {
      background: linear-gradient(90deg, #d52cff, #00cfff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      margin-top: 12px;
      color: #c9c9e8;
      font-size: 15px;
      letter-spacing: 3px;
    }

    .start {
      position: absolute;
      bottom: 100px;
      width: 72%;
      padding: 17px;
      border: none;
      border-radius: 40px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      background: linear-gradient(90deg, #a719ff, #244cff, #00bfff);
      box-shadow: 0 0 25px #6c36ff;
      transition: 0.2s;
    }

    .start:active {
      transform: scale(0.95);
    }

    .bottom {
      position: absolute;
      bottom: 35px;
      color: #7777aa;
      font-size: 13px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div class="splash">

    <div class="logo">JX</div>

    <div class="name">
      <span>JX</span> CHAT
    </div>

    <div class="tagline">
      Connect. Chat. Share.
    </div>

    <button class="start" onclick="startChat()">
      START →
    </button>

    <div class="bottom">
      Made for JX CHAT
    </div>

  </div>

  <script>
    function startChat() {
      alert("Welcome to JX CHAT! 💜💙");
    }
  </script>

</body>
</html>
